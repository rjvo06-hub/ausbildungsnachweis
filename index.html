<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Impresión - Encabezado Ajustado</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: Terminal, "Courier New", Courier, monospace; 
            font-size: 10pt;
            background-color: #f0f0f0;
        }

        .page {
            position: relative;
            width: 210mm;
            height: 297mm;
            margin: 20px auto;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        /* --- CAMPOS DEL ENCABEZADO --- */
        
        /* Nombre: Izquierda 13 cm, Superior 12.5 mm (sin cambios) */
        #nombre {
            position: absolute;
            left: 130mm;
            top: 12.5mm;
            height: 5mm;
            line-height: 5mm;
            white-space: nowrap;
        }

        /* Semana - Inicio (Día y mes): Izquierda 12.4 cm, Superior 20.0 mm (bajado 0.5 mm) */
        #semana-inicio {
            position: absolute;
            left: 124mm;
            top: 20.0mm; 
            height: 5mm;
            line-height: 5mm;
            white-space: nowrap;
        }

        /* Semana - Fin (Día y mes): Izquierda 14.4 cm, Superior 20.0 mm (bajado 0.5 mm) */
        #semana-fin {
            position: absolute;
            left: 144mm;
            top: 20.0mm;
            height: 5mm;
            line-height: 5mm;
            white-space: nowrap;
        }

        /* Año (Ej. 26): Izquierda 16.35 cm, Superior 20.0 mm (bajado 0.5 mm), ancho de 4 mm */
        #ano-fin {
            position: absolute;
            left: 163.5mm;
            top: 20.0mm;
            width: 4mm;
            height: 5mm;
            line-height: 5mm;
            white-space: nowrap;
            text-align: center;
        }

        /* Botón de impresión */
        .btn-imprimir {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14pt;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }

        .btn-imprimir:hover {
            background-color: #0056b3;
        }

        @media print {
            body {
                background-color: #ffffff;
            }
            .page {
                margin: 0;
                box-shadow: none;
            }
            .btn-imprimir {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir Encabezado</button>

    <div class="page">
        <!-- ENCABEZADO -->
        <div id="nombre">Santiago Vidales</div>
        <div id="semana-inicio">10.03</div>
        <div id="semana-fin">14.03</div>
        <div id="ano-fin">26</div>
    </div>

</body>
</html>
